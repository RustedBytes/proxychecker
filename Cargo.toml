[package]
name = "rsloop-rust-proxychecker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rsloop_rust_proxychecker"
crate-type = ["cdylib"]

[dependencies]
async-std = "1"
futures = "0.3"
pyo3 = { version = "0.28", features = ["extension-module"] }
rsloop = { version = "0.1.14" }
tokio = { version = "1", features = ["full"] }
wreq = { version = "5.3.0", features = ["socks"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
# strip = true
