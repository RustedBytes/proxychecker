[package]
name = "proxyprobe"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "proxyprobe"
crate-type = ["cdylib"]

[dependencies]
async-std = "1"
futures = "0.3"
pyo3 = { version = "0.29.3" }
rsloop = { version = "0.1.56" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "socks", "stream"] }

url = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
# strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
