name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quality-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --document-private-items

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python == '3.15' }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - run: cargo test --locked
      - name: Build and install Python extension
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --locked --out dist
          python -m pip install dist/*.whl
      - name: Test public Python API
        run: python -m unittest discover -s tests -v

  coverage:
    name: Coverage (>=90%)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install coverage tooling
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          python -m pip install "maturin>=1.7,<2"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/coverage
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Measure Rust + Python API coverage and enforce 90%
        run: bash scripts/coverage.sh
      - name: Upload coverage report and badge
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/report/
          if-no-files-found: warn
